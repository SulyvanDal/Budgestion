# Intégration continue (décision 0007) : les quatre vérifications, à chaque PR
# vers main et à chaque arrivée de code sur main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Le jeton fourni par GitHub ne peut que lire le dépôt.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
